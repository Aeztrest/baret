# Baret's EVM contracts (ported from Baret-Metropolis/contracts). docs/architecture/contracts.md
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64

# Same variable names as the API (docs/operations/environments.md).
[rpc_endpoints]
monad_testnet = "${CHAIN_MONAD_TESTNET_RPC_URL}"
monad = "${CHAIN_MONAD_RPC_URL}"

[fmt]
line_length = 100
