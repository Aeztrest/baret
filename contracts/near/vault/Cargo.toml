[package]
name = "baret-near-vault"
description = "Baret spend-limit vault for AI agents on NEAR (ADR-0011)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[features]
# Builds evm.rs without near-sdk, for `rustc --test` on machines that cannot build the
# unit-testing feature (its aws-lc-sys needs NASM/CMake on Windows). Never for the wasm.
standalone = []
