[package]
name = "baret-near-vault"
description = "Baret spend-limit vault for AI agents on NEAR (ADR-0011)"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

# NEP-330 reproducible build (`cargo near build reproducible-wasm`): the wasm is built in
# this pinned image, so anyone with Docker gets the same bytes, hence the same NEAR code
# hash, from the same commit. The image is pinned by digest, not by tag.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[features]
# Builds evm.rs without near-sdk, for `rustc --test` on machines that cannot build the
# unit-testing feature (its aws-lc-sys needs NASM/CMake on Windows). Never for the wasm.
standalone = []
