version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Explicit: updates go to main, never to the release branch.
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["@biomejs/*", "typescript", "vitest", "@vitest/*", "@types/*"]
      production:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    # Explicit: updates go to main, never to the release branch.
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
