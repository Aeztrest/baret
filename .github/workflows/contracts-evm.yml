name: Contracts (EVM)

on:
  pull_request:
    paths: ["contracts/evm/**", ".github/workflows/contracts-evm.yml"]
  push:
    branches: [main]
    paths: ["contracts/evm/**", ".github/workflows/contracts-evm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: Forge fmt, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
