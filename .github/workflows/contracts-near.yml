name: Contracts (NEAR)

on:
  pull_request:
    paths: ["contracts/near/**", ".github/workflows/contracts-near.yml"]
  push:
    branches: [main]
    paths: ["contracts/near/**", ".github/workflows/contracts-near.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/near
    steps:
      - uses: actions/checkout@v7
      # near-sdk 5.30 needs Rust 1.95+; cargo-near picks the wasm target NEAR's runtime accepts.
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked

  # The release wasm: a clean checkout with no build cache, so nothing of an earlier build
  # can reach it. Two runs of this job on one commit give the same code hash.
  wasm:
    name: reproducible wasm build
    needs: vault
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/near
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      # NEP-330 reproducible build: inside the image pinned by digest in vault/Cargo.toml,
      # so the same commit always gives the same bytes (the same NEAR code hash), and the
      # wasm carries its source (repository and commit) in `contract_source_metadata`.
      - name: Build the vault wasm (reproducible)
        working-directory: contracts/near/vault
        run: cargo near build reproducible-wasm
      - name: Build the blocklist wasm (reproducible)
        working-directory: contracts/near/blocklist
        run: cargo near build reproducible-wasm
      # NEAR stores base58(sha256(wasm)) as an account's code hash: printed here so the
      # deployed vault can be compared with this build (pnpm verify-vault does it locally).
      - name: NEAR code hash of each wasm
        working-directory: contracts/near
        run: |
          for wasm in baret_near_vault.wasm baret_near_blocklist.wasm; do
          node -e '
            const c = require("crypto"), f = require("fs");
            const file = process.argv[1];
            let n = BigInt("0x" + c.createHash("sha256").update(f.readFileSync(file)).digest("hex"));
            const A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
            let s = "";
            while (n > 0n) { s = A[Number(n % 58n)] + s; n /= 58n; }
            console.log(`${file}\ncode hash ${s}`);
            f.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `NEAR code hash of \`${file}\`: \`${s}\`\n`);
          ' "$(find target/near -name "$wasm" | head -1)"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: baret-near-vault-wasm
          path: contracts/near/target/near/**/baret_near_vault.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: baret-near-blocklist-wasm
          path: contracts/near/target/near/**/baret_near_blocklist.wasm
