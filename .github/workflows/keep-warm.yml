name: Keep staging warm, serve Agent Market

# The staging API is a free Render instance that sleeps after 15 idle minutes; a cold
# start takes up to a minute. NEAR HACKATHON judges and AI screeners call it from the
# README (2026-11-14 → 2026-11-25), so it is pinged every 10 minutes in November.
# The same run serves Baret's NEAR Agent Market listing: one pass of the self-hosted
# worker (packages/demo-near/scripts/market-agent.ts) picks up new hires and delivers.
# It needs the repository secret NEAR_MARKET_TOKEN (the agent's aat_ token, which can
# act only as that agent); without it the step is skipped.
# GitHub may delay scheduled runs; a late run only means a slower first call or delivery.

on:
  schedule:
    - cron: "*/10 * 9-30 11 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: GET /health
        run: curl -fsS --max-time 120 https://baret-api-staging.onrender.com/health -o /dev/null -w "%{http_code} in %{time_total}s\n" || true
      - name: Check for the Agent Market token
        id: market
        env:
          TOKEN: ${{ secrets.NEAR_MARKET_TOKEN }}
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.market.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.market.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.market.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: One pass of the Agent Market worker
        if: steps.market.outputs.enabled == 'true'
        env:
          NEAR_MARKET_TOKEN: ${{ secrets.NEAR_MARKET_TOKEN }}
        run: |
          pnpm install --frozen-lockfile --filter @baret/demo-near...
          pnpm --filter @baret/demo-near market-agent --once
